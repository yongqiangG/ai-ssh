[package]
name = "ssh-client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ssh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 启动自愈：孤儿后端的进程校验与清理（PID 存活/可执行路径/杀进程）
sysinfo = "0.33"
# 双开归一：第二实例只拉起已有窗口，保住「8091 占用者必是孤儿」公理
tauri-plugin-single-instance = "2"
# 开机自启（260821 手机伴侣阶段 3）：设置面板开关，默认关
tauri-plugin-autostart = "2"

# ── AI Coding 功能域（迁移自 nezha，见 docs/situations/260815-ai-coding-panel.md）──
# PTY 终端（claude/codex/本地 shell）
portable-pty = "0.8"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process", "io-util", "net"] }
# ── 手机伴侣 web 门面（docs/situations/260821-mobile-companion.md）──
# 内嵌 HTTP 服务：桌面进程内 axum 监听 18080，REST 只读 + WS PTY 流（阶段 2）
axum = { version = "0.8", features = ["ws"] }
# 静态资源内嵌：debug 构建从磁盘 dist-mobile/ 实时读（前端迭代免重编），release 打进二进制
rust-embed = "6.8"
tower = { version = "0.5", features = ["util"] }
once_cell = "1.19"
chrono = "0.4"
base64 = "0.22"
# 文件/hook 事件监听
notify = "6"
# gitignore 匹配（文件树标灰）
ignore = "0.4"
# 项目级配置与 codex hook 注入
toml = "0.8"
libc = "0.2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
# 文件树删除走回收站
trash = "=5.2.6"
# 终端字体枚举
font-kit = "=0.14.3"

# 内核级父死子亡：后端 JVM 挂进 KILL_ON_JOB_CLOSE 的 Job Object
[target.'cfg(windows)'.dependencies]
win32job = "2"
# AI Coding pending-confirmation desktop notification (Windows toast; click callback uses launch
# parameter + single-instance approach, see docs/situations/260817-coding-desktop-notification.md).
# Goes directly through windows-rs system templates—winrt-toast-reborn's hand-built ToastGeneric
# XML is silently rejected by the shell (probe D vs A/E differential testing, 260817).
# Win32_System_Power: 手机伴侣 keep-awake 守卫的 SetThreadExecutionState（260821 阶段 3）。
windows = { version = "0.61", features = ["UI_Notifications", "Data_Xml_Dom", "Win32_System_Power"] }

