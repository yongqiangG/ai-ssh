server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:13306/ai_ssh?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource

# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# SSH 加密配置；dev 默认密钥（Base64，解码 32 字节），生产环境必须用环境变量覆盖
ssh:
  crypto:
    secret-key: "ZGV2X2RlZmF1bHRfc2VjcmV0X2tleV8zMmJ5dGVzISE="

# ===== AI 对话配置（Google ADK + SpringAI 桥接 OpenAI 兼容端点）=====
# ⚠️ 必须把 base-url / api-key / model 改成你自己的真实值，否则 chat_stream 会调用失败（401 等）。
ai:
  api:
    # 智谱 BigModel（GLM）OpenAI 兼容端点
    # 为规避 SpringAI RestClient 路径拼接歧义：base-url 只写 host，完整路径放 completions-path
    base-url: https://open.bigmodel.cn
    # api-key 从 ZHIPU_API_KEY 读取（由 application-local.yml 提供或环境变量注入，勿写明文进此文件）
    api-key: ${ZHIPU_API_KEY:}
    completions-path: /api/coding/paas/v4/chat/completions   # GLM Coding Plan 专用端点（已 curl 验证 200）
    model: glm-5.2                            # GLM Coding Plan 推理模型（已 curl 验证 200；大小写不敏感）
  agent:
    id: sshAssistant                        # 前端选择与请求携带的 agentId
    name: sshAssistant                      # 同时作为 ADK appName（会话命名空间）
    description: AI Shell 助手，可流式回答问题
    instruction: |                          # 系统提示词（多行）
      你是一个友好、专业的 AI 助手。请用简洁清晰的中文回答用户的问题。
      注意：当前为最小闭环，仅支持纯对话，暂未接入 SSH 命令执行能力。
    output-key: chat_result                 # ADK 写入 session state 的结果 key