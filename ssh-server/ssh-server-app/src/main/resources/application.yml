spring:
  config:
    name: ssh-server-app
    # 导入本地敏感配置（application-local.yml，已 gitignore）：提供 ZHIPU_API_KEY 等。
    # optional：文件不存在不报错（CI/生产无此文件也能启动，届时用环境变量）
    import:
      - "optional:classpath:application-local.yml"
      - "optional:file:./config/application-local.yml"
  profiles:
    active: single
  servlet:
    multipart:
      # 文件传输上限：覆盖 Spring 默认 1MB，与 SftpController.MAX_UPLOAD_BYTES 对齐
      max-file-size: 100MB
      max-request-size: 100MB
      # ≤10MB 留内存；>10MB 落磁盘临时文件，避免大文件占满堆
      file-size-threshold: 10MB
