spring:
  config:
    name: ssh-server-app
    # 导入本地敏感配置（application-local.yml，已 gitignore）：提供 ZHIPU_API_KEY 等。
    # optional：文件不存在不报错（CI/生产无此文件也能启动，届时用环境变量）
    import:
      - "optional:classpath:application-local.yml"
      - "optional:file:./config/application-local.yml"
  profiles:
    active: dev
